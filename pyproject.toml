[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-to-quadlet"
version = "0.1.0"
authors = [
  { name="The 17711 Frame", email="author@example.com" },
]
description = "A tool to convert Docker Compose files to Podman Quadlet systemd units."
readme = "README.md"
requires-python = ">=3.11"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic",
    "pyyaml",
    "jinja2",
    "click",
]

[project.scripts]
compose-to-quadlet = "compose_to_quadlet.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
compose_to_quadlet = ["templates/*.j2"]

[tool.poetry.dependencies]
python="^3.11"
pydantic="^2.6"
jinja2="^3.1"
pyyaml="^6.0"
click="^8.1"
[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)"
]
